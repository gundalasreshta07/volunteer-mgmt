{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white border border-gray-200 rounded-2xl p-6 md:p-8 shadow-sm">
        <h1 class="text-2xl font-bold mb-1">Create Volunteer Account</h1>
        <p class="text-sm text-gray-600 mb-6">Join drives and track your impact.</p>

        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Name</label>
                <input type="text" name="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Phone</label>
                <input type="text" name="phone" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">City</label>
                <select name="city_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">Select city</option>
                    {% for city in cities %}
                        <option value="{{ city.city_id }}">{{ city.name }}, {{ city.state }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700">
                Register
            </button>
        </form>
    </div>
</div>
{% endblock %}
